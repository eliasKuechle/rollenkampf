name: Dashboard aktualisieren

on:
  schedule:
    - cron: "*/5 * * * *"   # so oft wie GitHub erlaubt (in der Praxis oft 5–15 Min.)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # für Keepalive (verhindert Pause nach 60 Tagen Inaktivität)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten von intervals.icu holen
        run: python scripts/fetch.py
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
      - name: Prüfen, ob sich etwas geändert hat
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PAGE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
        run: |
          curl -fsSL "$PAGE" -o /tmp/old.json || echo '{}' > /tmp/old.json
          python - <<'PY'
          import json, os
          new = json.load(open("site/data.json"))
          try:
              old = json.load(open("/tmp/old.json"))
          except Exception:
              old = {}
          strip = lambda d: {k: v for k, v in d.items() if k != "updated"}
          changed = strip(new) != strip(old)
          deploy = changed or os.environ["EVENT"] != "schedule"
          print("Daten geändert:", changed, "| Deploy:", deploy)
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"deploy={'true' if deploy else 'false'}\n")
          PY
      - if: steps.diff.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.diff.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: liskin/gh-workflow-keepalive@v1
