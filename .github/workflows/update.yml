name: Dashboard aktualisieren

on:
  schedule:
    - cron: "17 * * * *"   # stündlich
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten von intervals.icu holen
        run: python scripts/fetch.py
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          # Falls Coach-Zugriff nicht klappt: eigene Keys der Freunde als Secrets anlegen
          INTERVALS_KEY_FREUND1: ${{ secrets.INTERVALS_KEY_FREUND1 }}
          INTERVALS_KEY_FREUND2: ${{ secrets.INTERVALS_KEY_FREUND2 }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
